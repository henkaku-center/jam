<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A collaborative 2D space designed for local, in-person jam sessions and live performances.">
  <title>jam</title>
  <script type="importmap">
    {
      "imports": {
        "@strudel/core": "/vendor/strudel-web/index.mjs",
        "@strudel/webaudio": "/vendor/strudel-web/index.mjs",
        "yjs": "/vendor/yjs.js",
        "y-websocket": "/vendor/y-websocket.js"
      }
    }
  </script>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <!-- Load Tailwind or other stylesheets if requested, but as per DESIGN.md: "Prefer Vanilla CSS" -->
</head>
<body>
  <!-- Click to Join Overlay (Autoplay Handling) -->
  <div id="autoplay-overlay" class="overlay">
    <div class="overlay-card">
      <div class="logo">jam</div>
      <p class="subtitle">A shared 2D space for music and visuals.</p>

      <div class="mode-selection">
        <button id="join-host-btn" class="btn btn-primary">
          <div class="btn-title">Join</div>
          <div class="btn-desc">Connect to the shared canvas.</div>
        </button>
      </div>
      <div class="footer-tip">Local Wi-Fi, 2–16 participants.</div>
    </div>
  </div>

  <!-- Main Workspace UI -->
  <div id="app" class="hidden">
    <!-- Spatial 2D Canvas Container -->
    <div id="canvas-viewport" class="viewport">
      <div id="canvas-grid" class="grid-layer"></div>
      <div id="canvas-elements" class="elements-layer"></div>
    </div>

    <!-- Live low-opacity agent terminal -->
    <div id="agent-terminal" class="agent-terminal" aria-label="Agent terminal">
      <div id="agent-terminal-viewport"></div>
      <div id="agent-terminal-focus-zone" aria-hidden="true"></div>
    </div>

    <div id="add-element-menu" class="add-element-menu hidden" role="menu" aria-label="Add element menu">
      <button type="button" data-add-element="strudel" role="menuitem">Strudel</button>
      <button type="button" data-add-element="synth" role="menuitem">Synth</button>
      <button type="button" data-add-element="visual" role="menuitem">Visual</button>
      <button type="button" data-add-element="tool" role="menuitem">Tool</button>
    </div>

    <!-- Focus Mode Overlay Indicator -->
    <div id="focus-overlay" class="focus-overlay hidden">
      <div class="focus-text">FOCUS</div>
    </div>
  </div>

  <!-- Core Modules Loaded dynamically as ESM -->
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit/lib/addon-fit.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
